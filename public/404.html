<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="/favicon.ico" sizes="48x48">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#081327">
  <meta name="robots" content="noindex,follow">
  <title>페이지를 찾을 수 없습니다 | CLIME</title>
  <meta name="description" content="요청한 페이지는 존재하지 않거나 제공이 종료되었습니다. 현재 CLIME 유심 개통 혜택 및 상담 페이지를 확인하세요.">
  <style>
    :root{color-scheme:dark}*{box-sizing:border-box}
    body{margin:0;min-height:100vh;background:radial-gradient(ellipse 65% 35% at 50% 0%,#1f487d,transparent),linear-gradient(#0a1b35,#060e1c);font-family:Pretendard,"Apple SD Gothic Neo",system-ui,-apple-system,sans-serif;color:#eff6ff;display:grid;place-items:center}
    main{width:min(90%,520px);padding:48px 22px;text-align:center}
    .mark{width:80px;height:80px;border:1px solid #5178a5;border-radius:25px;background:#112d56;margin:0 auto 25px;display:grid;place-items:center;font-size:35px;font-weight:900;color:#83d6ff}
    .eyebrow{font-weight:800;color:#83d6ff;font-size:14px;letter-spacing:.16em}
    h1,p,a,small{word-break:keep-all;line-break:strict;overflow-wrap:break-word}
    h1{font-size:clamp(29px,6vw,42px);letter-spacing:-.04em;margin:12px 0 18px;line-height:1.3}
    p{font-size:16px;line-height:1.8;color:#c4d5e7;margin:0 0 29px}
    .actions{display:flex;justify-content:center;gap:12px;flex-wrap:wrap}
    a{display:inline-flex;align-items:center;justify-content:center;min-width:185px;padding:16px 20px;border-radius:14px;font-weight:800;text-decoration:none;min-height:56px;background:#72dcef;color:#073053}
    a.secondary{background:#10294d;border:1px solid #5384b4;color:#ebf7ff}
    a:focus-visible{outline:3px solid #fff;outline-offset:3px}
    small{display:block;margin-top:27px;color:#94aac2}
  </style>
</head>
<body>
<main>
  <div class="mark" aria-hidden="true">404</div>
  <div class="eyebrow">CLIME · 페이지 안내</div>
  <h1>페이지를 찾을 수 없습니다</h1>
  <p>요청하신 주소는 현재 제공되지 않습니다.<br>최신 유심 개통 혜택 및 참여 조건은 공식 홈페이지에서 확인할 수 있습니다.</p>
  <div class="actions">
    <a href="/">공식 홈페이지로 이동</a>
    <a href="/about/" class="secondary">CLIME 소개</a>
    <a href="/guide/" class="secondary">혜택 조건 살펴보기</a>
  </div>
  <small>CLIME · climekr.com</small>
</main>
</body>
</html>
