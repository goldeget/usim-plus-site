<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex,nofollow" />
  <title>전체 신청 · USIM PLUS 운영 콘솔</title>
  <link rel="stylesheet" href="/admin/admin-shell.css" />
</head>
<body>
  <main class="admin-main" data-admin-page="applications">
    <section class="intro">
      <p class="eyebrow">신청 관리</p>
      <h1>전체 신청</h1>
      <p>접수와 검토 결과를 상태별로 확인합니다. 접수번호는 공개하지 말고, 필요한 사진만 관리자 인증 화면에서 열어보세요.</p>
    </section>
    <div class="admin-toolbar" aria-label="신청 이력 필터">
      <label for="statusFilter">검토 상태</label>
      <select id="statusFilter">
        <option value="all">전체 신청</option>
        <option value="pending">미검토</option>
        <option value="approved">승인</option>
        <option value="rejected">반려</option>
      </select>
      <button id="refreshApplications" type="button">새로고침</button>
    </div>
    <p id="applicationStatus" class="status" role="status" aria-live="polite">신청 이력을 불러오고 있습니다.</p>
    <section aria-label="신청 이력 목록">
      <div id="applicationsList" class="admin-list" aria-live="polite" aria-busy="true"></div>
      <div class="admin-toolbar"><button id="loadMore" type="button" hidden>이전 신청 더 보기</button></div>
    </section>
    <p class="note">접수와 검토 기록은 검토 결정 후 60일이 지나면 정리됩니다. 신청자 이름과 인터넷 주소 원문은 수집하지 않습니다.</p>
  </main>
  <dialog id="applicationImageDialog" class="image-dialog" aria-labelledby="applicationImageTitle">
    <div class="image-dialog__head"><h2 id="applicationImageTitle">접수 사진</h2><button id="closeApplicationImage" class="admin-button" type="button">닫기</button></div>
    <img id="applicationImage" class="image-dialog__image" alt="신청자가 제출한 개통 현황 사진" />
  </dialog>
  <script>
    const filter = document.getElementById("statusFilter");
    const list = document.getElementById("applicationsList");
    const state = document.getElementById("applicationStatus");
    const more = document.getElementById("loadMore");
    const dialog = document.getElementById("applicationImageDialog");
    let cursor = null;
    let loading = false;
    const labels = { pending: ["검토 대기", "pending"], approved: ["승인 완료", "approved"], rejected: ["반려 완료", "rejected"] };
    function formatKst(value) {
      const date = new Date(value);
      return Number.isNaN(date.valueOf()) ? "시간 정보 없음" : date.toLocaleString("ko-KR", { timeZone: "Asia/Seoul", year: "numeric", month: "numeric", day: "numeric", hour: "2-digit", minute: "2-digit" });
    }
    function photoAvailable(item) {
      const reference = item.reviewedAt || item.createdAt;
      return Date.now() - Date.parse(reference) < 30 * 24 * 60 * 60 * 1000;
    }
    function openImage(item) {
      document.getElementById("applicationImageTitle").textContent = `${item.id} · 접수 사진`;
      document.getElementById("applicationImage").src = `/api/admin/applications/image?id=${encodeURIComponent(item.id)}`;
      dialog.showModal();
    }
    function createRecord(item) {
      const record = document.createElement("article");
      record.className = "admin-record";
      const main = document.createElement("div");
      main.className = "admin-record__main";
      const heading = document.createElement("div");
      heading.className = "admin-record__title";
      const id = document.createElement("strong");
      id.textContent = `접수번호 ${item.id}`;
      const [statusText, statusClass] = item.photoExpired ? ["미검토 · 사진 만료", "expired"] : (labels[item.status] || ["확인 필요", "expired"]);
      const statusBadge = document.createElement("span");
      statusBadge.className = `status-badge ${statusClass}`;
      statusBadge.textContent = statusText;
      heading.append(id, statusBadge);
      const meta = document.createElement("div");
      meta.className = "admin-record__meta";
      const created = document.createElement("span");
      created.textContent = `접수 ${formatKst(item.createdAt)}`;
      const file = document.createElement("span");
      file.textContent = `${item.contentType === "image/png" ? "PNG" : "JPEG"} · ${(item.sizeBytes / 1024).toFixed(0)}KB`;
      meta.append(created, file);
      if (item.reviewedAt) {
        const reviewed = document.createElement("span");
        reviewed.textContent = `결정 ${formatKst(item.reviewedAt)}`;
        meta.append(reviewed);
      }
      main.append(heading, meta);
      const actions = document.createElement("div");
      actions.className = "admin-record__actions";
      if (photoAvailable(item)) {
        const photoButton = document.createElement("button");
        photoButton.type = "button";
        photoButton.textContent = "사진 확인";
        photoButton.addEventListener("click", () => openImage(item));
        actions.append(photoButton);
      } else {
        const expired = document.createElement("span");
        expired.className = "status-badge expired";
        expired.textContent = "사진 보관 기간 종료";
        actions.append(expired);
      }
      if (item.status === "pending" && !item.photoExpired) {
        const review = document.createElement("a");
        review.className = "primary";
        review.href = `/admin/review.html?focus=${encodeURIComponent(item.id)}`;
        review.textContent = "검토하기";
        actions.append(review);
      }
      record.append(main, actions);
      return record;
    }
    function showEmpty() {
      const empty = document.createElement("div");
      empty.className = "admin-empty";
      empty.textContent = "선택한 상태의 신청이 없습니다.";
      list.replaceChildren(empty);
    }
    async function loadApplications(reset = false) {
      if (loading) return;
      loading = true;
      more.disabled = true;
      list.setAttribute("aria-busy", "true");
      if (reset) {
        cursor = null;
        list.replaceChildren();
        state.textContent = "신청 이력을 불러오고 있습니다.";
        state.classList.remove("error");
      }
      const params = new URLSearchParams({ status: filter.value });
      if (cursor) params.set("cursor", cursor);
      try {
        const response = await fetch(`/api/admin/applications?${params}`, { credentials: "same-origin", cache: "no-store", headers: { Accept: "application/json" } });
        const data = await response.json().catch(() => ({}));
        if (!response.ok) throw new Error(data.error || "신청 이력을 불러오지 못했습니다.");
        cursor = data.nextCursor || null;
        for (const item of data.items || []) list.append(createRecord(item));
        if (!list.children.length) showEmpty();
        state.textContent = `${list.querySelectorAll(".admin-record").length}건을 표시하고 있습니다. 시간은 한국 표준시(KST) 기준입니다.`;
        more.hidden = !cursor;
      } catch (error) {
        state.textContent = error.message;
        state.classList.add("error");
      } finally {
        loading = false;
        more.disabled = false;
        list.setAttribute("aria-busy", "false");
      }
    }
    const queryStatus = new URLSearchParams(location.search).get("status");
    if (["pending", "approved", "rejected", "all"].includes(queryStatus)) filter.value = queryStatus;
    filter.addEventListener("change", () => loadApplications(true));
    document.getElementById("refreshApplications").addEventListener("click", () => loadApplications(true));
    more.addEventListener("click", () => loadApplications());
    document.getElementById("closeApplicationImage").addEventListener("click", () => dialog.close());
    dialog.addEventListener("close", () => { document.getElementById("applicationImage").removeAttribute("src"); });
    loadApplications(true);
  </script>
  <script src="/admin/admin-shell.js" defer></script>
  <script src="/admin/admin-auth.js" defer></script>
</body>
</html>
