<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="/favicon.ico" sizes="48x48">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex,nofollow" />
  <title>전체 신청 · USIM PLUS 운영 콘솔</title>
  <link rel="stylesheet" href="/admin/admin-shell.css" />
  <link rel="stylesheet" href="/admin/applications.css" />
<link rel="stylesheet" href="/copy-typography.css">
</head>
<body>
  <main class="admin-main" data-admin-page="applications">
    <section class="intro">
      <p class="eyebrow">신청 관리</p>
      <h1>전체 신청</h1>
      <p>신청 상태를 확인하고, 접수번호를 입력하면 해당 기록으로 바로 이동할 수 있습니다. 사진은 검토에 필요할 때만 열어보세요.</p>
    </section>
    <section class="application-controls" aria-label="신청 찾기와 상태 필터">
      <div class="admin-toolbar" aria-label="신청 이력 필터">
        <label for="statusFilter">검토 상태</label>
        <select id="statusFilter">
          <option value="all">전체 신청</option>
          <option value="pending">미검토</option>
          <option value="approved">승인</option>
          <option value="rejected">반려</option>
        </select>
        <button id="refreshApplications" type="button">새로고침</button>
      </div>
      <form id="applicationSearch" class="admin-search" role="search">
        <label for="applicationIdSearch">접수번호로 바로 찾기</label>
        <div class="admin-search__row">
          <input id="applicationIdSearch" name="id" type="search" maxlength="25" autocomplete="off" placeholder="UP-로 시작하는 접수번호" />
          <button type="submit">찾기</button>
          <button id="clearApplicationSearch" class="admin-search__clear" type="button" hidden>초기화</button>
        </div>
      </form>
    </section>
    <p id="applicationStatus" class="status" role="status" aria-live="polite">신청 이력을 불러오고 있습니다.</p>
    <nav class="admin-pagination" aria-label="신청 목록 페이지">
      <button id="previousPage" type="button" disabled>이전 목록</button>
      <span id="pageIndicator" aria-live="polite">1페이지</span>
      <button id="nextPage" type="button" hidden>다음 목록</button>
    </nav>
    <section aria-label="신청 이력 목록">
      <div id="applicationsList" class="admin-list" aria-live="polite" aria-busy="true"></div>
    </section>
    <p class="note">접수와 검토 기록은 검토 결정 후 60일이 지나면 정리됩니다. 신청자 이름과 인터넷 주소 원문은 수집하지 않습니다.</p>
  </main>
  <dialog id="applicationImageDialog" class="image-dialog" aria-labelledby="applicationImageTitle">
    <div class="image-dialog__head"><h2 id="applicationImageTitle">접수 사진</h2><button id="closeApplicationImage" class="admin-button" type="button">닫기</button></div>
    <img id="applicationImage" class="image-dialog__image" alt="신청자가 제출한 개통 현황 사진" />
  </dialog>
  <script>
    const filter = document.getElementById("statusFilter");
    const refreshButton = document.getElementById("refreshApplications");
    const list = document.getElementById("applicationsList");
    const state = document.getElementById("applicationStatus");
    const dialog = document.getElementById("applicationImageDialog");
    const previous = document.getElementById("previousPage");
    const next = document.getElementById("nextPage");
    const pageIndicator = document.getElementById("pageIndicator");
    const searchForm = document.getElementById("applicationSearch");
    const searchInput = document.getElementById("applicationIdSearch");
    const searchButton = searchForm.querySelector('button[type="submit"]');
    const clearSearch = document.getElementById("clearApplicationSearch");
    let cursorStack = [null];
    let pageIndex = 0;
    let nextCursor = null;
    let searchId = "";
    let loading = false;
    const labels = { pending: ["검토 대기", "pending"], approved: ["승인 완료", "approved"], rejected: ["반려 완료", "rejected"] };
    function formatKst(value) {
      const date = new Date(value);
      return Number.isNaN(date.valueOf()) ? "시간 정보 없음" : date.toLocaleString("ko-KR", { timeZone: "Asia/Seoul", year: "numeric", month: "numeric", day: "numeric", hour: "2-digit", minute: "2-digit" });
    }
    function photoAvailable(item) {
      const reference = item.reviewedAt || item.createdAt;
      return Date.now() - Date.parse(reference) < 30 * 24 * 60 * 60 * 1000;
    }
    function openImage(item) {
      document.getElementById("applicationImageTitle").textContent = `${item.id} · 접수 사진`;
      document.getElementById("applicationImage").src = `/api/admin/applications/image?id=${encodeURIComponent(item.id)}`;
      dialog.showModal();
    }
    function createRecord(item) {
      const record = document.createElement("article");
      record.className = "admin-record";
      const main = document.createElement("div");
      main.className = "admin-record__main";
      const heading = document.createElement("div");
      heading.className = "admin-record__title";
      const id = document.createElement("strong");
      id.textContent = `접수번호 ${item.id}`;
      const [statusText, statusClass] = item.photoExpired ? ["미검토 · 사진 만료", "expired"] : (labels[item.status] || ["확인 필요", "expired"]);
      const statusBadge = document.createElement("span");
      statusBadge.className = `status-badge ${statusClass}`;
      statusBadge.textContent = statusText;
      heading.append(id, statusBadge);
      const meta = document.createElement("div");
      meta.className = "admin-record__meta";
      const created = document.createElement("span");
      created.textContent = `접수 ${formatKst(item.createdAt)}`;
      const file = document.createElement("span");
      file.textContent = `${item.contentType === "image/png" ? "PNG" : "JPEG"} · ${(item.sizeBytes / 1024).toFixed(0)}KB`;
      meta.append(created, file);
      if (item.reviewedAt) {
        const reviewed = document.createElement("span");
        reviewed.textContent = `결정 ${formatKst(item.reviewedAt)}`;
        meta.append(reviewed);
      }
      main.append(heading, meta);
      const actions = document.createElement("div");
      actions.className = "admin-record__actions";
      if (photoAvailable(item)) {
        const photoButton = document.createElement("button");
        photoButton.type = "button";
        photoButton.textContent = "사진 확인";
        photoButton.addEventListener("click", () => openImage(item));
        actions.append(photoButton);
      } else {
        const expired = document.createElement("span");
        expired.className = "status-badge expired";
        expired.textContent = "사진 보관 기간 종료";
        actions.append(expired);
      }
      if (item.status === "pending" && !item.photoExpired) {
        const review = document.createElement("a");
        review.className = "primary";
        review.href = `/admin/review.html?focus=${encodeURIComponent(item.id)}`;
        review.textContent = "검토하기";
        actions.append(review);
      }
      record.append(main, actions);
      return record;
    }
    function showEmpty() {
      const empty = document.createElement("div");
      empty.className = "admin-empty";
      empty.textContent = "선택한 상태의 신청이 없습니다.";
      list.replaceChildren(empty);
    }
    function setControlsBusy(busy) {
      filter.disabled = busy;
      refreshButton.disabled = busy;
      searchInput.disabled = busy;
      searchButton.disabled = busy;
      clearSearch.disabled = busy;
    }
    async function loadApplications({ preserveRows = false, rollback = null } = {}) {
      if (loading) return;
      loading = true;
      const requestStatus = filter.value;
      const requestSearchId = searchId;
      const requestPageIndex = pageIndex;
      setControlsBusy(true);
      previous.disabled = true;
      next.disabled = true;
      list.setAttribute("aria-busy", "true");
      if (!preserveRows) list.replaceChildren();
      state.textContent = "신청 이력을 불러오고 있습니다.";
      state.classList.remove("error");
      const params = new URLSearchParams({ status: requestSearchId ? "all" : requestStatus });
      if (requestSearchId) params.set("id", requestSearchId);
      else if (cursorStack[requestPageIndex]) params.set("cursor", cursorStack[requestPageIndex]);
      try {
        const response = await fetch(`/api/admin/applications?${params}`, { credentials: "same-origin", cache: "no-store", headers: { Accept: "application/json" } });
        const data = await response.json().catch(() => ({}));
        if (!response.ok) throw new Error(data.error || "신청 이력을 불러오지 못했습니다.");
        nextCursor = data.nextCursor || null;
        const items = data.items || [];
        const records = document.createDocumentFragment();
        for (const item of items) records.append(createRecord(item));
        list.replaceChildren(records);
        if (!items.length) showEmpty();
        state.textContent = requestSearchId
          ? `${items.length}건을 찾았습니다.`
          : `${items.length}건 · ${requestPageIndex + 1}페이지 · 시간은 한국 표준시(KST) 기준입니다.`;
        pageIndicator.textContent = requestSearchId ? "검색 결과" : `${requestPageIndex + 1}페이지`;
        previous.hidden = Boolean(requestSearchId);
        previous.disabled = Boolean(requestSearchId) || requestPageIndex === 0;
        next.hidden = Boolean(requestSearchId) || !nextCursor;
        next.disabled = Boolean(requestSearchId) || !nextCursor;
        clearSearch.hidden = !requestSearchId;
      } catch (error) {
        if (rollback) {
          pageIndex = rollback.pageIndex;
          nextCursor = rollback.nextCursor;
        } else {
          nextCursor = null;
          list.replaceChildren();
        }
        state.textContent = error.message;
        state.classList.add("error");
        pageIndicator.textContent = searchId ? "검색 결과" : `${pageIndex + 1}페이지`;
        previous.hidden = Boolean(searchId);
        previous.disabled = Boolean(searchId) || pageIndex === 0;
        next.hidden = Boolean(searchId) || !nextCursor;
        next.disabled = Boolean(searchId) || !nextCursor;
        clearSearch.hidden = !searchId;
      } finally {
        loading = false;
        setControlsBusy(false);
        list.setAttribute("aria-busy", "false");
      }
    }
    const initialParams = new URLSearchParams(location.search);
    const queryStatus = initialParams.get("status");
    if (["pending", "approved", "rejected", "all"].includes(queryStatus)) filter.value = queryStatus;
    const initialId = initialParams.get("id") || "";
    if (/^UP-[A-Za-z0-9_-]{22}$/.test(initialId)) {
      searchId = initialId;
      searchInput.value = initialId;
      filter.value = "all";
      clearSearch.hidden = false;
    }
    function syncLocation() {
      const params = new URLSearchParams(location.search);
      params.set("status", searchId ? "all" : filter.value);
      if (searchId) params.set("id", searchId);
      else params.delete("id");
      params.delete("cursor");
      history.replaceState(null, "", `${location.pathname}?${params}`);
    }
    const resetHistory = ({ clear = false } = {}) => {
      cursorStack = [null];
      pageIndex = 0;
      nextCursor = null;
      if (clear) { searchId = ""; searchInput.value = ""; }
      loadApplications();
    };
    filter.addEventListener("change", () => { resetHistory({ clear: true }); syncLocation(); });
    refreshButton.addEventListener("click", () => resetHistory());
    searchForm.addEventListener("submit", event => {
      event.preventDefault();
      const rawValue = searchInput.value.trim();
      const value = /^up-/i.test(rawValue) ? `UP-${rawValue.slice(3)}` : rawValue;
      if (value && !/^UP-[A-Za-z0-9_-]{22}$/.test(value)) {
        state.textContent = "UP-로 시작하는 접수번호를 정확히 입력해 주세요.";
        state.classList.add("error");
        searchInput.focus();
        return;
      }
      searchId = value;
      if (searchId) filter.value = "all";
      cursorStack = [null];
      pageIndex = 0;
      syncLocation();
      loadApplications();
    });
    clearSearch.addEventListener("click", () => { resetHistory({ clear: true }); syncLocation(); });
    previous.addEventListener("click", () => {
      if (loading || pageIndex === 0 || searchId) return;
      const rollback = { pageIndex, nextCursor };
      pageIndex -= 1;
      loadApplications({ preserveRows: true, rollback });
    });
    next.addEventListener("click", () => {
      if (loading || !nextCursor || searchId) return;
      const rollback = { pageIndex, nextCursor };
      cursorStack[pageIndex + 1] = nextCursor;
      pageIndex += 1;
      loadApplications({ preserveRows: true, rollback });
    });
    document.getElementById("closeApplicationImage").addEventListener("click", () => dialog.close());
    dialog.addEventListener("close", () => { document.getElementById("applicationImage").removeAttribute("src"); });
    loadApplications();
  </script>
  <script src="/admin/admin-shell.js" defer></script>
  <script src="/admin/admin-auth.js" defer></script>
</body>
</html>
