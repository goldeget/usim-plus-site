<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex,nofollow" />
  <title>신청 사진 검토 · USIM PLUS</title>
  <style>
    :root{color-scheme:dark;--bg:#07121d;--panel:#0c1d2b;--panel2:#102536;--line:#203b4e;--text:#eaf5fa;--muted:#9bb2c1;--mint:#59e4d2;--blue:#65c7ed;--red:#ff9a9a}
    *{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 50% -30%,#16344a 0,transparent 55%),var(--bg);color:var(--text);font:15px/1.6 system-ui,-apple-system,"Noto Sans KR",sans-serif}
    a{color:inherit}.bar{position:sticky;top:0;z-index:2;background:#07121deF;border-bottom:1px solid var(--line);backdrop-filter:blur(12px)}.bar-inner{max-width:1120px;margin:auto;padding:14px 22px;display:flex;align-items:center;justify-content:space-between;gap:12px}.brand{font-weight:850;letter-spacing:.04em}.wrap{width:min(100% - 36px,1050px);margin:auto}.main{padding:36px 0 64px}.intro{margin-bottom:22px}.intro h1{font-size:clamp(26px,4vw,38px);line-height:1.2;margin:0 0 9px}.intro p{color:var(--muted);margin:0}.panel{background:linear-gradient(145deg,var(--panel),#091824);border:1px solid var(--line);border-radius:18px;padding:22px;box-shadow:0 22px 65px #0003}.panel-head{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:18px}.panel-head h2{font-size:18px;margin:0}.count{border:1px solid #28776e;color:#9ef5e9;background:#0b302d;padding:5px 11px;border-radius:999px;font-size:12px;font-weight:800}.status{margin:0 0 14px;color:var(--muted)}.status.error{color:var(--red)}.queue{display:grid;gap:14px}.item{display:grid;grid-template-columns:minmax(150px,260px) minmax(0,1fr);gap:20px;padding:15px;border:1px solid var(--line);border-radius:14px;background:var(--panel2)}.preview{display:block;position:relative;overflow:hidden;width:100%;min-height:170px;padding:0;border:1px solid #355469;border-radius:10px;background:#07121d;cursor:zoom-in}.preview img{display:block;width:100%;height:100%;max-height:300px;min-height:170px;object-fit:contain}.item-info{min-width:0;display:flex;flex-direction:column}.item-info h3{font-size:16px;margin:0 0 7px;overflow-wrap:anywhere}.meta{display:grid;grid-template-columns:auto 1fr;gap:4px 13px;color:var(--muted);font-size:13px}.meta dt{font-weight:700;color:#c4d9e4}.meta dd{margin:0}.actions{display:flex;flex-wrap:wrap;gap:9px;margin-top:auto;padding-top:17px}.btn{min-height:42px;border:1px solid #3a596d;border-radius:9px;padding:9px 15px;background:#142c3d;color:var(--text);font:inherit;font-size:14px;font-weight:800;text-decoration:none;cursor:pointer}.btn:hover{border-color:var(--blue)}.btn:focus-visible,.preview:focus-visible,a:focus-visible{outline:3px solid var(--mint);outline-offset:3px}.btn.approve{border-color:#247d72;background:#12463f;color:#c2fff4}.btn.reject{border-color:#814f59;background:#482a32;color:#ffd2d6}.btn:disabled{opacity:.55;cursor:wait}.empty{padding:34px 16px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:12px}.more-row{text-align:center;padding-top:17px}.top-link{color:var(--blue);font-weight:700;text-decoration:none}.note{margin:18px 1px 0;color:var(--muted);font-size:12px}
    dialog{width:min(96vw,1100px);max-width:none;max-height:95vh;padding:13px;border:1px solid #55778c;border-radius:14px;background:#07121d;color:var(--text)}dialog::backdrop{background:#000c;backdrop-filter:blur(4px)}.dialog-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:0 0 10px}.dialog-head h2{margin:0;font-size:15px;overflow-wrap:anywhere}.dialog-image{display:block;width:100%;max-height:calc(95vh - 90px);object-fit:contain}.close{min-width:42px}.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
    @media(max-width:680px){.bar-inner{padding:12px 17px}.wrap{width:min(100% - 24px,1050px)}.main{padding-top:25px}.panel{padding:14px}.panel-head{align-items:flex-start}.item{grid-template-columns:1fr;gap:12px;padding:11px}.preview{min-height:145px}.preview img{min-height:145px;max-height:240px}.actions .btn{flex:1}.meta{gap:4px 8px}.note{font-size:11px}}
  </style>
</head>
<body>
  <header class="bar"><div class="bar-inner"><div class="brand">USIM PLUS · 신청 검토</div><a class="top-link" href="/">콘텐츠 관리로 돌아가기</a></div></header>
  <main class="wrap main">
    <section class="intro"><h1>접수 사진 검토</h1><p>접수번호, 사진, 접수 시각을 확인한 뒤 한 번만 검토 결과를 기록할 수 있습니다.</p></section>
    <div id="queueStatus" class="status" role="status" aria-live="polite">접수 목록을 불러오는 중입니다…</div>
    <section class="panel" aria-labelledby="queueTitle">
      <div class="panel-head"><h2 id="queueTitle">미검토 신청</h2><span id="count" class="count">0건</span></div>
      <div id="queue" class="queue" aria-live="polite" aria-busy="true"></div>
      <div class="more-row"><button id="loadMore" class="btn" type="button" hidden>더 불러오기</button></div>
    </section>
    <p class="note">사진 원본은 권한이 있는 관리자 화면에서만 열립니다. 미검토 사진은 접수 후 30일, 검토한 사진은 결정 후 30일 보관되며 자동 삭제 처리 시점은 저장소 반영 상황에 따라 다를 수 있습니다.</p>
  </main>
  <dialog id="imageDialog" aria-labelledby="dialogTitle">
    <div class="dialog-head"><h2 id="dialogTitle">접수 사진 원본</h2><button id="closeDialog" class="btn close" type="button" aria-label="사진 미리보기 닫기">닫기</button></div>
    <img id="dialogImage" class="dialog-image" alt="신청자가 제출한 개통 현황 사진 원본" />
  </dialog>
  <script>
    const queue=document.getElementById("queue");
    const queueStatus=document.getElementById("queueStatus");
    const loadMore=document.getElementById("loadMore");
    const dialog=document.getElementById("imageDialog");
    let nextCursor=null;
    let loading=false;

    function setStatus(message,error=false){queueStatus.textContent=message;queueStatus.classList.toggle("error",error)}
    function formatBytes(size){return size<1024?`${size} B`:size<1024*1024?`${(size/1024).toFixed(1)} KB`:`${(size/1024/1024).toFixed(1)} MB`}
    function formatDate(value){const date=new Date(value);return Number.isNaN(date.valueOf())?"시간 정보 없음":date.toLocaleString("ko-KR")}
    function metadata(label,value){const dt=document.createElement("dt");dt.textContent=label;const dd=document.createElement("dd");dd.textContent=value;return [dt,dd]}

    function createItem(item){
      const card=document.createElement("article");card.className="item";card.dataset.id=item.id;
      const preview=document.createElement("button");preview.type="button";preview.className="preview";preview.setAttribute("aria-label",`${item.id} 사진 원본 크게 보기`);
      const thumbnail=document.createElement("img");thumbnail.src=`/api/admin/applications/image?id=${encodeURIComponent(item.id)}`;thumbnail.alt="신청자가 제출한 개통 현황 사진";thumbnail.loading="lazy";
      thumbnail.addEventListener("error",()=>{preview.replaceChildren();preview.textContent="사진을 불러오지 못했습니다.";preview.disabled=true;preview.style.cursor="not-allowed"},{once:true});
      preview.append(thumbnail);preview.addEventListener("click",()=>{document.getElementById("dialogTitle").textContent=`${item.id} · 사진 원본`;document.getElementById("dialogImage").src=thumbnail.src;dialog.showModal()});
      const info=document.createElement("div");info.className="item-info";
      const heading=document.createElement("h3");heading.textContent=`접수번호 ${item.id}`;
      const dl=document.createElement("dl");dl.className="meta";
      dl.append(...metadata("접수 시각",formatDate(item.createdAt)),...metadata("사진 형식",item.contentType==="image/png"?"PNG":"JPEG"),...metadata("파일 크기",formatBytes(item.sizeBytes)));
      const actions=document.createElement("div");actions.className="actions";
      const approve=document.createElement("button");approve.type="button";approve.className="btn approve";approve.textContent="승인";approve.addEventListener("click",()=>decide(item.id,"approved",card,actions));
      const reject=document.createElement("button");reject.type="button";reject.className="btn reject";reject.textContent="반려";reject.addEventListener("click",()=>decide(item.id,"rejected",card,actions));
      actions.append(approve,reject);info.append(heading,dl,actions);card.append(preview,info);return card;
    }

    async function decide(id,decision,card,actions){
      const label=decision==="approved"?"승인":"반려";
      if(!window.confirm(`${id} 신청을 ${label} 처리할까요? 결정 후에는 변경할 수 없습니다.`))return;
      const buttons=[...actions.querySelectorAll("button")];buttons.forEach(button=>button.disabled=true);setStatus(`${id} 검토 결과를 저장하는 중입니다…`);
      try{
        const response=await fetch("/api/admin/applications/review",{method:"POST",credentials:"same-origin",cache:"no-store",headers:{"Content-Type":"application/json"},body:JSON.stringify({id,decision})});
        const data=await response.json().catch(()=>({}));if(!response.ok)throw new Error(data.error||"검토 결과를 저장하지 못했습니다.");
        card.remove();const remaining=queue.querySelectorAll(".item").length;document.getElementById("count").textContent=`${remaining}건`;
        setStatus(`${id} 신청을 ${label} 처리했습니다. 사진은 결정일로부터 30일 뒤 만료됩니다.`);
        if(!remaining&&!nextCursor)showEmpty();
      }catch(error){setStatus(error.message,true);buttons.forEach(button=>button.disabled=false)}
    }

    function showEmpty(){const empty=document.createElement("div");empty.className="empty";empty.textContent="현재 미검토 신청이 없습니다.";queue.replaceChildren(empty);document.getElementById("count").textContent="0건"}

    async function loadQueue(reset=false){
      if(loading)return;loading=true;queue.setAttribute("aria-busy","true");loadMore.disabled=true;
      if(reset){queue.replaceChildren();nextCursor=null;setStatus("접수 목록을 불러오는 중입니다…")}
      try{
        const query=nextCursor?`?cursor=${encodeURIComponent(nextCursor)}`:"";
        const response=await fetch(`/api/admin/applications${query}`,{credentials:"same-origin",cache:"no-store",headers:{Accept:"application/json"}});
        const data=await response.json().catch(()=>({}));if(!response.ok)throw new Error(data.error||(response.status===403?"관리자 인증 후 다시 접속해 주세요.":"접수 목록을 불러오지 못했습니다."));
        nextCursor=data.nextCursor||null;for(const item of data.items||[])queue.append(createItem(item));
        const count=queue.querySelectorAll(".item").length;document.getElementById("count").textContent=`${count}건`;
        if(!count&&!nextCursor)showEmpty();
        setStatus(count?`${count}건의 미검토 신청을 표시하고 있습니다.`:"미검토 신청이 없습니다.");
        loadMore.hidden=!nextCursor;
      }catch(error){setStatus(error.message,true)}
      finally{loading=false;queue.setAttribute("aria-busy","false");loadMore.disabled=false}
    }

    loadMore.addEventListener("click",()=>loadQueue());
    document.getElementById("closeDialog").addEventListener("click",()=>dialog.close());
    dialog.addEventListener("click",event=>{if(event.target===dialog)dialog.close()});
    loadQueue(true);
  </script>
</body>
</html>
