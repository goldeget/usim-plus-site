<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#082743">
  <title>안내 콘텐츠 · USIM PLUS 운영 콘솔</title>
  <style>
    :root{font-family:Inter,"Noto Sans KR",system-ui,-apple-system,"Segoe UI",sans-serif;color:#12283e;background:#f3f7fa;font-synthesis:none;--navy:#082743;--blue:#1265a8;--line:#dce6ee;--muted:#5e7183}*{box-sizing:border-box}body{margin:0;line-height:1.55}.bar{background:#082743;color:#fff;padding:18px 0}.wrap{width:min(960px,calc(100% - 32px));margin:auto}.bar-inner{display:flex;align-items:center;justify-content:space-between;gap:20px}.brand{font-weight:850;letter-spacing:-.03em}.bar-actions{display:flex;align-items:center;gap:10px}.tag{font-size:12px;border:1px solid #ffffff4d;border-radius:99px;padding:6px 10px;color:#d9f5f5}.logout{border:1px solid #ffffff55;border-radius:8px;padding:7px 11px;background:transparent;color:#fff;font:inherit;font-size:12px;font-weight:750;cursor:pointer}.logout:hover{background:#ffffff12}.logout:focus-visible{outline:3px solid #83e8da;outline-offset:2px}.logout:disabled{opacity:.55}.main{padding:38px 0 72px}.intro{margin-bottom:22px}.intro h1{font-size:clamp(27px,4vw,38px);letter-spacing:-.05em;margin:0 0 8px;color:var(--navy)}.intro p{margin:0;color:var(--muted);font-size:14px}.status{margin:18px 0;padding:13px 15px;border-radius:10px;background:#e7f4f4;border:1px solid #c6e3e4;color:#215a68;font-size:13px}.status.error{background:#fff1ed;border-color:#f4c9bc;color:#8b3b2b}.panel{background:#fff;border:1px solid var(--line);border-radius:16px;padding:23px;margin:14px 0;box-shadow:0 10px 35px #1337550a}.panel h2{font-size:18px;margin:0 0 16px;color:var(--navy);letter-spacing:-.03em}.field{margin:14px 0}.field label{display:block;font-weight:750;font-size:13px;margin-bottom:6px}.field small{display:block;color:#718395;font-size:12px;margin-top:5px}.field input,.field textarea{font:inherit;width:100%;border:1px solid #cad8e2;border-radius:9px;padding:12px 13px;color:#142a3e;background:#fff}.field textarea{min-height:85px;resize:vertical}.field input:focus,.field textarea:focus{outline:3px solid #a7dce4;border-color:#218b9e}.row{display:grid;grid-template-columns:1fr 1fr;gap:14px}.entry{position:relative;border-top:1px solid #e5edf2;margin-top:16px;padding-top:13px}.entry h3{font-size:14px;color:#31546b;margin:0 0 8px}.entry .field{margin:9px 0}.actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:20px}.btn{border:0;border-radius:9px;padding:11px 16px;font:inherit;font-weight:750;cursor:pointer}.primary{background:#0e5b86;color:white}.secondary{background:#eaf1f5;color:#24455e}.danger{background:#fff0ee;color:#943e31}.btn:disabled{opacity:.55;cursor:wait}.foot{color:#6e8293;font-size:12px;margin-top:18px}.loading{color:#718395}.visually-hidden{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
    @media(max-width:650px){.row{grid-template-columns:1fr;gap:0}.panel{padding:17px}.bar-inner{align-items:flex-start;flex-direction:column;gap:8px}.bar-actions{gap:7px}.tag{font-size:11px}}
  </style>
  <link rel="stylesheet" href="/admin/admin-shell.css" />
</head>
<body>
  <main class="wrap main admin-main" data-admin-page="content">
    <section class="intro"><p class="eyebrow">사이트 운영</p><h1>홈페이지 안내 관리</h1><p>첫 화면 제목과 참여 단계, 자주 묻는 질문을 수정합니다. 저장한 내용은 공개 홈페이지에 반영됩니다.</p></section>
    <div id="status" class="status" role="status" aria-live="polite">콘텐츠를 불러오는 중입니다…</div>
    <div id="legacyNotice" class="status" role="note" hidden></div>
    <form id="editor">
      <section class="panel"><h2>첫 화면 제목과 안내</h2><div class="field"><label for="headline">첫 화면 제목</label><textarea id="headline" maxlength="100" rows="2" required></textarea><small>줄을 바꾸려면 Enter를 누르세요. 최대 100자</small></div><div class="field"><label for="introText">참여 안내</label><textarea id="introText" maxlength="500" required></textarea><small>최대 500자</small></div></section>
      <section class="panel"><h2>참여 단계 안내</h2><p class="note">참여 단계는 세 개로 고정되어 있습니다. 단계 이름과 설명만 수정할 수 있습니다.</p><div id="checklist"></div></section>
      <section class="panel"><h2>자주 묻는 질문</h2><div id="faqs"></div><div class="actions"><button id="addFaq" class="btn secondary" type="button">질문 추가</button></div></section>
      <div class="actions"><button id="save" class="btn primary" type="submit">변경사항 저장</button><button id="reset" class="btn secondary" type="button">불러온 내용으로 되돌리기</button><span id="savedAt" class="foot"></span></div>
    </form>
    <p class="foot">관리자 이메일과 비밀번호로 접속하는 보호된 운영 화면입니다.</p>
  </main>
  <script src="/admin/admin-shell.js" defer></script>
  <script src="/admin/admin-auth.js" defer></script>
  <script>
    const defaults={schemaVersion:2,headline:"유심 개통하면\n최대 51만원",intro:"개통 전 참여 조건과 통신사 요금·약정을 먼저 확인하세요. 참여를 원하면 개통 후 현황 사진으로 신청하세요.",checklist:[{title:"1. 개통 전 조건 확인",body:"개통 전에 지급 조건과 통신사 공식 안내의 요금, 약정 기간, 해지 비용을 먼저 확인하세요."},{title:"2. 개통 후 사진 신청",body:"조건에 맞으면 유심을 개통한 뒤, 개통 현황이 보이는 화면을 사진으로 보내 신청합니다."},{title:"3. 유지 조건 확인 후 지급",body:"유지 기간과 신청 조건을 확인한 뒤 지급 대상이 결정됩니다."}],faqs:[{question:"사진을 첨부하면 누가 확인하나요?",answer:"로그인한 운영자가 사진을 확인합니다. 사진은 검토 결정 후 30일, 미검토 신청은 접수 후 30일 동안 비공개로 보관합니다."},{question:"사진에는 어떤 내용을 보여야 하나요?",answer:"현재 개통 현황과 심사에 필요한 항목이 식별되도록 첨부해 주세요. 주민등록번호 전체, 인증번호, 비밀번호 등 심사와 무관한 민감정보는 가려 주세요. 실제 제출 범위는 운영자의 개인정보 처리 안내를 확인하세요."},{question:"지급 금액과 신청 가능 건수는 어떻게 되나요?",answer:"각 조건을 충족하고 유지 기간이 확인되면 개통 1건당 3일 5만원, 15일 추가 5만원, 30일 추가 7만원의 지급 대상이 됩니다. 한 사람 최대 3건이며 모든 조건이 확인되면 최대 51만원입니다. 3일 유지가 확인되지 않으면 첫 5만원은 지급 대상에서 제외됩니다. 실제 지급 기준과 시점은 신청 전에 문의해 확인하세요."},{question:"가입 전에 무엇을 확인해야 하나요?",answer:"통신사 공식 안내에서 월 요금, 약정 기간, 해지 절차와 비용을 확인하고, 이 사이트의 지급 조건도 먼저 살펴보세요. 개통 현황 사진 제출은 개통을 마친 뒤 진행합니다. 사진 검토는 통신사 개통 승인이나 지급 확정이 아닙니다."},{question:"왜 참여자를 모집하나요?",answer:"통신사 개통 실적 향상을 위해 참여자를 모집합니다."},{question:"사진 검토를 통과하면 개통이나 지급이 확정되나요?",answer:"아닙니다. 사진 검토는 제출한 정보의 사전 확인입니다. 실제 개통 가능 여부는 통신사가 결정하며, 지급 여부와 시점은 신청 조건을 확인해 주세요."},{question:"클라임유심 후기나 climekr 유심 후기를 살펴볼 때 무엇을 확인해야 하나요?",answer:"후기를 볼 때는 작성 시점, 가입 통신사·요금제·약정 조건, 실제 확인 가능한 이용 경험인지 살펴보세요. 신청 전에는 현재 안내된 지급 조건, 통신사 요금·약정·해지 비용, 개인정보 사진 보관 기간도 함께 확인해 주세요. 사진 사전 검토 결과는 통신사 개통 승인이나 지급 확정을 뜻하지 않습니다."}]};
    let original=structuredClone(defaults);const statusEl=document.getElementById("status");
    function setStatus(text,error=false){statusEl.textContent=text;statusEl.classList.toggle("error",error)}
    function field(label,kind,value,max){const d=document.createElement("div");d.className="field";const l=document.createElement("label");const id="f"+Math.random().toString(36).slice(2);l.htmlFor=id;l.textContent=label;const el=document.createElement(kind==="textarea"?"textarea":"input");el.id=id;el.value=value||"";el.maxLength=max;el.required=true;d.append(l,el);return {wrap:d,input:el}}
    function renderEntries(container,items,type){container.replaceChildren();items.forEach((item,i)=>{const block=document.createElement("div");block.className="entry";const h=document.createElement("h3");h.textContent=`${type==="faq"?"질문":"항목"} ${i+1}`;block.append(h);const a=field(type==="faq"?"질문":"항목 제목","input",type==="faq"?item.question:item.title,type==="faq"?160:80);const b=field(type==="faq"?"답변":"설명","textarea",type==="faq"?item.answer:item.body,type==="faq"?400:300);block.append(a.wrap,b.wrap);if(type==="faq"){const remove=document.createElement("button");remove.type="button";remove.className="btn danger";remove.textContent="삭제";remove.addEventListener("click",()=>{if(container.children.length<=1)return setStatus("FAQ는 하나 이상 남겨야 합니다.",true);items.splice(i,1);renderEntries(container,items,type)});block.append(remove)}container.append(block)})}
    function fill(data){original=structuredClone(data);document.getElementById("headline").value=data.headline;document.getElementById("introText").value=data.intro;renderEntries(document.getElementById("checklist"),data.checklist,"check");renderEntries(document.getElementById("faqs"),data.faqs,"faq");}
    function readEntries(container,type){return [...container.querySelectorAll(".entry")].map(x=>{const inputs=x.querySelectorAll("input,textarea");return type==="faq"?{question:inputs[0].value.trim(),answer:inputs[1].value.trim()}:{title:inputs[0].value.trim(),body:inputs[1].value.trim()}})}
    document.getElementById("addFaq").addEventListener("click",()=>{const c=document.getElementById("faqs");if(c.children.length>=10)return setStatus("FAQ는 최대 10개까지 등록할 수 있습니다.",true);const items=readEntries(c,"faq");items.push({question:"",answer:""});renderEntries(c,items,"faq")});
    document.getElementById("reset").addEventListener("click",()=>fill(original));
    fetch("/api/content",{credentials:"same-origin",cache:"no-store",headers:{Accept:"application/json"}}).then(async r=>{const data=await r.json().catch(()=>({}));if(!r.ok)throw new Error(data.error||(r.status===401?"로그인 시간이 만료됐습니다. 다시 로그인해 주세요.":"콘텐츠를 불러오지 못했습니다."));fill({...defaults,...data});if(!data.cmsReady){document.getElementById("save").disabled=true;setStatus("저장소가 연결되지 않았습니다. 관리 설정이 끝날 때까지 편집할 수 없습니다.",true);return}if(data.legacyContent){document.getElementById("legacyNotice").hidden=false;document.getElementById("legacyNotice").textContent="이전에 저장된 일반 안내 문구는 현재 홈페이지와 내용이 달라 적용하지 않습니다. 아래 현재 홈페이지 문구를 수정해 저장하면 공개 페이지에 반영됩니다."}setStatus(data.legacyContent?"현재 홈페이지에 표시되는 내용을 불러왔습니다.":"홈페이지 안내를 불러왔습니다. 수정 후 저장할 수 있습니다.")}).catch(e=>{document.getElementById("save").disabled=true;setStatus(e.message,true)});
    document.getElementById("editor").addEventListener("submit",async e=>{e.preventDefault();const btn=document.getElementById("save");btn.disabled=true;setStatus("저장 중입니다…");const data={schemaVersion:2,headline:document.getElementById("headline").value.trim(),intro:document.getElementById("introText").value.trim(),checklist:readEntries(document.getElementById("checklist"),"check"),faqs:readEntries(document.getElementById("faqs"),"faq")};try{const r=await fetch("/api/content",{method:"PUT",credentials:"same-origin",headers:{"Content-Type":"application/json"},body:JSON.stringify(data)});const result=await r.json().catch(()=>({}));if(!r.ok)throw new Error(result.error||"저장에 실패했습니다.");fill({...defaults,...result.content});document.getElementById("legacyNotice").hidden=true;document.getElementById("savedAt").textContent="마지막 저장: "+new Date(result.updatedAt).toLocaleString("ko-KR",{timeZone:"Asia/Seoul"})+" KST";setStatus("저장했습니다. 공개 홈페이지에 반영됩니다.")}catch(err){setStatus(err.message,true)}finally{btn.disabled=false}});
  </script>
</body>
</html>
