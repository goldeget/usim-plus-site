<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#082743">
  <title>USIM PLUS | 콘텐츠 관리</title>
  <style>
    :root{font-family:Inter,"Noto Sans KR",system-ui,-apple-system,"Segoe UI",sans-serif;color:#12283e;background:#f3f7fa;font-synthesis:none;--navy:#082743;--blue:#1265a8;--line:#dce6ee;--muted:#5e7183}*{box-sizing:border-box}body{margin:0;line-height:1.55}.bar{background:#082743;color:#fff;padding:18px 0}.wrap{width:min(960px,calc(100% - 32px));margin:auto}.bar-inner{display:flex;align-items:center;justify-content:space-between;gap:20px}.brand{font-weight:850;letter-spacing:-.03em}.tag{font-size:12px;border:1px solid #ffffff4d;border-radius:99px;padding:6px 10px;color:#d9f5f5}.main{padding:38px 0 72px}.intro{margin-bottom:22px}.intro h1{font-size:clamp(27px,4vw,38px);letter-spacing:-.05em;margin:0 0 8px;color:var(--navy)}.intro p{margin:0;color:var(--muted);font-size:14px}.status{margin:18px 0;padding:13px 15px;border-radius:10px;background:#e7f4f4;border:1px solid #c6e3e4;color:#215a68;font-size:13px}.status.error{background:#fff1ed;border-color:#f4c9bc;color:#8b3b2b}.panel{background:#fff;border:1px solid var(--line);border-radius:16px;padding:23px;margin:14px 0;box-shadow:0 10px 35px #1337550a}.panel h2{font-size:18px;margin:0 0 16px;color:var(--navy);letter-spacing:-.03em}.field{margin:14px 0}.field label{display:block;font-weight:750;font-size:13px;margin-bottom:6px}.field small{display:block;color:#718395;font-size:12px;margin-top:5px}.field input,.field textarea{font:inherit;width:100%;border:1px solid #cad8e2;border-radius:9px;padding:12px 13px;color:#142a3e;background:#fff}.field textarea{min-height:85px;resize:vertical}.field input:focus,.field textarea:focus{outline:3px solid #a7dce4;border-color:#218b9e}.row{display:grid;grid-template-columns:1fr 1fr;gap:14px}.entry{position:relative;border-top:1px solid #e5edf2;margin-top:16px;padding-top:13px}.entry h3{font-size:14px;color:#31546b;margin:0 0 8px}.entry .field{margin:9px 0}.actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:20px}.btn{border:0;border-radius:9px;padding:11px 16px;font:inherit;font-weight:750;cursor:pointer}.primary{background:#0e5b86;color:white}.secondary{background:#eaf1f5;color:#24455e}.danger{background:#fff0ee;color:#943e31}.btn:disabled{opacity:.55;cursor:wait}.foot{color:#6e8293;font-size:12px;margin-top:18px}.loading{color:#718395}.visually-hidden{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
    @media(max-width:650px){.row{grid-template-columns:1fr;gap:0}.panel{padding:17px}.bar-inner{align-items:flex-start;flex-direction:column;gap:8px}}
  </style>
</head>
<body>
  <header class="bar"><div class="wrap bar-inner"><div class="brand">USIM PLUS · 콘텐츠 관리</div><span class="tag">Cloudflare Access 인증 필요</span></div></header>
  <main class="wrap main">
    <section class="intro"><h1>안내 콘텐츠 관리</h1><p>공개 안내 페이지의 제목, 체크 항목, FAQ를 수정합니다. 이용자 신청서·사진·개통 정보는 이 화면에서 받거나 저장하지 않습니다.</p></section>
    <div id="status" class="status" role="status" aria-live="polite">콘텐츠를 불러오는 중입니다…</div>
    <form id="editor">
      <section class="panel"><h2>첫 화면</h2><div class="field"><label for="headline">제목</label><input id="headline" maxlength="100" required></div><div class="field"><label for="introText">안내 문구</label><textarea id="introText" maxlength="500" required></textarea><small>최대 500자</small></div></section>
      <section class="panel"><h2>가입 전 확인 항목</h2><div id="checklist"></div><div class="actions"><button id="addChecklist" class="btn secondary" type="button">항목 추가</button></div></section>
      <section class="panel"><h2>자주 묻는 질문</h2><div id="faqs"></div><div class="actions"><button id="addFaq" class="btn secondary" type="button">질문 추가</button></div></section>
      <div class="actions"><button id="save" class="btn primary" type="submit">변경사항 저장</button><button id="reset" class="btn secondary" type="button">불러온 내용으로 되돌리기</button><span id="savedAt" class="foot"></span></div>
    </form>
    <p class="foot">인증 화면이 반복되거나 접근이 차단되면 Cloudflare Zero Trust Access의 관리자 계정과 허용 이메일을 확인하세요.</p>
  </main>
  <script>
    const defaults={headline:"유심 가입 전, 조건부터 확인하세요.",intro:"요금제와 개통 조건은 통신사·상품별로 다를 수 있습니다. 가입을 진행하기 전에 해당 통신사의 공식 홈페이지나 고객센터에서 최신 안내와 계약 조건을 확인하세요.",checklist:[{title:"월 요금과 제공 내용",body:"기본료, 데이터·통화 제공량, 부가서비스와 할인 종료 시점까지 확인하세요."},{title:"개통 조건과 기기 호환",body:"본인 확인에 필요한 절차, 이용 가능한 단말기와 유심 종류를 공식 채널에서 확인하세요."},{title:"약정·해지 조건",body:"약정 기간, 해지 신청 방법, 위약금이나 반환 비용이 발생하는 조건을 계약 전에 살펴보세요."}],faqs:[{question:"통신사별 개통 조건은 어디서 확인하나요?",answer:"가입하려는 통신사의 공식 홈페이지, 공식 앱 또는 고객센터에서 현재 조건을 확인하세요. 판매처 안내와 계약서 내용도 함께 비교하는 것이 좋습니다."},{question:"이 페이지에서 유심 신청이나 개통 가능 여부 확인을 할 수 있나요?",answer:"아니요. 이 페이지는 일반 정보 안내용이며 가입 신청, 개통 판정, 사진·신분증 접수를 하지 않습니다."},{question:"가입 후 해지할 때 비용이 발생할 수 있나요?",answer:"요금제와 계약 조건에 따라 달라질 수 있습니다. 약정, 할인 반환, 단말기 할부 등 관련 항목을 해당 통신사의 공식 약관과 계약서에서 확인하세요."},{question:"인증번호나 개통 화면을 전달해도 되나요?",answer:"인증번호, 비밀번호, 신분증 사진, 계정 화면은 타인에게 전달하지 마세요. 요청을 받으면 공식 고객센터를 통해 먼저 확인하세요."}]};
    let original=structuredClone(defaults);const statusEl=document.getElementById("status");
    function setStatus(text,error=false){statusEl.textContent=text;statusEl.classList.toggle("error",error)}
    function field(label,kind,value,max){const d=document.createElement("div");d.className="field";const l=document.createElement("label");const id="f"+Math.random().toString(36).slice(2);l.htmlFor=id;l.textContent=label;const el=document.createElement(kind==="textarea"?"textarea":"input");el.id=id;el.value=value||"";el.maxLength=max;el.required=true;d.append(l,el);return {wrap:d,input:el}}
    function renderEntries(container,items,type){container.replaceChildren();items.forEach((item,i)=>{const block=document.createElement("div");block.className="entry";const h=document.createElement("h3");h.textContent=`${type==="faq"?"질문":"항목"} ${i+1}`;block.append(h);const a=field(type==="faq"?"질문":"항목 제목","input",type==="faq"?item.question:item.title,type==="faq"?160:80);const b=field(type==="faq"?"답변":"설명","textarea",type==="faq"?item.answer:item.body,type==="faq"?400:300);block.append(a.wrap,b.wrap);const remove=document.createElement("button");remove.type="button";remove.className="btn danger";remove.textContent="삭제";remove.addEventListener("click",()=>{if(container.children.length<=1)return setStatus(type==="faq"?"FAQ는 하나 이상 남겨야 합니다.":"확인 항목은 하나 이상 남겨야 합니다.",true);items.splice(i,1);renderEntries(container,items,type)});block.append(remove);container.append(block)})}
    function fill(data){original=structuredClone(data);document.getElementById("headline").value=data.headline;document.getElementById("introText").value=data.intro;renderEntries(document.getElementById("checklist"),data.checklist,"check");renderEntries(document.getElementById("faqs"),data.faqs,"faq");}
    function readEntries(container,type){return [...container.querySelectorAll(".entry")].map(x=>{const inputs=x.querySelectorAll("input,textarea");return type==="faq"?{question:inputs[0].value.trim(),answer:inputs[1].value.trim()}:{title:inputs[0].value.trim(),body:inputs[1].value.trim()}})}
    document.getElementById("addChecklist").addEventListener("click",()=>{const c=document.getElementById("checklist");if(c.children.length>=6)return setStatus("확인 항목은 최대 6개까지 등록할 수 있습니다.",true);const items=readEntries(c,"check");items.push({title:"",body:""});renderEntries(c,items,"check")});
    document.getElementById("addFaq").addEventListener("click",()=>{const c=document.getElementById("faqs");if(c.children.length>=10)return setStatus("FAQ는 최대 10개까지 등록할 수 있습니다.",true);const items=readEntries(c,"faq");items.push({question:"",answer:""});renderEntries(c,items,"faq")});
    document.getElementById("reset").addEventListener("click",()=>fill(original));
    fetch("/api/content",{credentials:"same-origin",headers:{Accept:"application/json"}}).then(async r=>{const data=await r.json().catch(()=>({}));if(!r.ok)throw new Error(data.error||(r.status===401||r.status===403?"관리자 인증이 필요합니다. Cloudflare Access로 로그인한 뒤 다시 시도하세요.":"콘텐츠를 불러오지 못했습니다."));fill({...defaults,...data});if(!data.cmsReady){document.getElementById("save").disabled=true;setStatus("저장소가 연결되지 않았습니다. 관리 설정이 끝날 때까지 편집할 수 없습니다.",true);return}setStatus("콘텐츠를 불러왔습니다. 수정 후 저장할 수 있습니다.")}).catch(e=>{document.getElementById("save").disabled=true;setStatus(e.message,true)});
    document.getElementById("editor").addEventListener("submit",async e=>{e.preventDefault();const btn=document.getElementById("save");btn.disabled=true;setStatus("저장 중입니다…");const data={headline:document.getElementById("headline").value.trim(),intro:document.getElementById("introText").value.trim(),checklist:readEntries(document.getElementById("checklist"),"check"),faqs:readEntries(document.getElementById("faqs"),"faq")};try{const r=await fetch("/api/content",{method:"PUT",credentials:"same-origin",headers:{"Content-Type":"application/json"},body:JSON.stringify(data)});const result=await r.json().catch(()=>({}));if(!r.ok)throw new Error(result.error||"저장에 실패했습니다.");fill({...defaults,...result.content});document.getElementById("savedAt").textContent="마지막 저장: "+new Date(result.updatedAt).toLocaleString("ko-KR");setStatus("저장했습니다. 공개 안내 페이지에 변경 내용이 반영됩니다.")}catch(err){setStatus(err.message,true)}finally{btn.disabled=false}});
  </script>
</body>
</html>
