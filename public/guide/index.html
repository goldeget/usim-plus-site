  <script>
    (async function () {
      try {
        const response = await fetch('/api/content', { cache: 'no-store', headers: { Accept: 'application/json' } });
        if (!response.ok) throw new Error('content unavailable');
        const content = await response.json();
        const links = content.supportLinks || {};
        const allowed = { telegram: 't.me', channeltalk: 'climeusim.channel.io' };
        for (const key of Object.keys(allowed)) {
          const candidate = links[key];
          if (typeof candidate !== 'string') continue;
          const url = new URL(candidate);
          if (url.protocol !== 'https:' || url.hostname !== allowed[key] || url.username || url.password) continue;
          document.querySelectorAll('[data-channel="' + key + '"]').forEach(a => { a.href = url.href; });
        }
      } catch {}
    })();
