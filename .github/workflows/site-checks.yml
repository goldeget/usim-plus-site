name: Site checks

on:
  push:
    branches:
      - main
      - feat/transparent-benefits-guide-20261026
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  node-tests:
    name: Node 22 test suite
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Configure Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run no-install tests
        run: npm test
